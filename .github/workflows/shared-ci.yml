name: Shared CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/shared/**"
      - ".github/workflows/shared-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: packages/shared

      - name: Type check
        run: bun run tsc
        working-directory: packages/shared

      - name: Lint
        run: bun run lint
        working-directory: packages/shared

      - name: Test
        run: bun run test
        working-directory: packages/shared
