name: Native CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/native/**"
      - "packages/shared/**"
      - ".github/workflows/native-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: packages/native

      - name: Type check
        run: bun run tsc
        working-directory: packages/native

      - name: Lint
        run: bun run lint
        working-directory: packages/native

      # Uncomment when test files are added
      # - name: Test
      #   run: bun run test
      #   working-directory: packages/native
